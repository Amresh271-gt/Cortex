plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amresh.cortex'
    compileSdk 34

    defaultConfig {
        applicationId "com.amresh.cortex"
        minSdk 24
        targetSdk 34
        // Cortex 1.0 is the first release of the new project. For every later update,
        // raise versionCode by 1 (so it installs over the old one) and change versionName.
        versionCode 1
        versionName "1.0"
    }

    // Same debug signing key for every build, so a new APK installs over the old one
    // (GitHub Actions would otherwise create a fresh random key on each run).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
