name: Build APK

on:
  push:
    # main = latest tested version; v*, V* = saved version branches.
    branches: [ main, master, 'v*', 'V*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Cortex-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # The branch name is part of the artifact name so builds of different branches are easy to tell apart.
          name: Cortex-${{ github.head_ref || github.ref_name }}-debug-apk
          path: Cortex-debug.apk
